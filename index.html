<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AgendaPro</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#6D28D9">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AgendaPro">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <script src="./config.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #6D28D9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #loading img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }

    #loading p {
      color: rgba(255,255,255,0.8);
      font-size: 16px;
    }

    iframe {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div id="loading">
    <img src="./icon-192.png" alt="AgendaPro">
    <p>Carregando AgendaPro...</p>
  </div>

  <iframe id="app" src="" allow="camera; microphone"></iframe>

  <script>
    const iframe = document.getElementById("app");
    const loading = document.getElementById("loading");

    iframe.src = STREAMLIT_URL;

    iframe.onload = function() {
      loading.style.display = "none";
      iframe.style.display = "block";
    };

    // Fallback: esconde loading após 8 segundos mesmo sem evento onload
    setTimeout(function() {
      loading.style.display = "none";
      iframe.style.display = "block";
    }, 8000);
  </script>

</body>
</html>
